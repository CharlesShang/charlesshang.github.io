<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charles Shang</title>
  <meta name="description" content="Charles Shang personal homepage">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ef;
      --ink: #1f2933;
      --muted: #5d6673;
      --accent: #0f766e;
      --line: #d9d4ca;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    main {
      width: min(680px, calc(100% - 40px));
      margin: 0 auto;
      padding: 18vh 0 56px;
    }

    .intro {
      max-width: 560px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.04rem, 2vw, 1.24rem);
      line-height: 1.75;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 56px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .links a {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 450;
      text-decoration: none;
    }

    .links a:hover {
      color: var(--accent);
    }

    .content-section {
      margin-top: 72px;
    }

    .content-section h2 {
      margin: 0 0 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      font-family: ui-serif, "Songti TC", "Songti SC", "Noto Serif CJK TC", "Noto Serif CJK SC", Georgia, serif;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0;
    }

    .content-section .blog-title {
      display: flex;
      align-items: center;
      letter-spacing: 0.08em;
    }

    .blog-title svg {
      width: 1.05em;
      height: 1.05em;
      margin: 0 0.08em 0 0.02em;
      color: var(--accent);
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    .blog-title .face-eye {
      fill: currentColor;
      stroke: none;
    }

    .script-word {
      display: inline-block;
      margin: 0 0.08em;
      color: var(--accent);
      font-family: "Snell Roundhand", "Apple Chancery", "Segoe Script", "Brush Script MT", cursive;
      font-size: 1.75em;
      font-weight: 600;
      line-height: 0.55;
      transform: rotate(-5deg);
      vertical-align: -0.08em;
    }

    .content-links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .content-links--single {
      grid-template-columns: 1fr;
    }

    .content-card {
      display: block;
      min-height: 132px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.42);
      text-decoration: none;
    }

    .content-card:hover {
      border-color: var(--accent);
    }

    .content-card h3 {
      margin: 0 0 10px;
      font-family: ui-serif, "Songti TC", "Songti SC", "Noto Serif CJK TC", "Noto Serif CJK SC", Georgia, serif;
      font-size: 1rem;
      letter-spacing: 0;
    }

    .content-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.65;
    }

    .content-card p + p {
      margin-top: 8px;
    }

    @media (max-width: 720px) {
      main {
        padding-top: 22vh;
      }

      .content-links {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="intro">Reader. Thinker. Explorer.</p>

    <section class="content-section" aria-labelledby="blog-title">
      <h2 class="blog-title" id="blog-title" aria-label="Blog">
        <span aria-hidden="true">BL</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <circle class="face-eye" cx="9" cy="10" r="1"/>
          <circle class="face-eye" cx="15" cy="10" r="1"/>
          <path d="M8 14c1 1.6 2.3 2.4 4 2.4s3-.8 4-2.4"/>
        </svg>
        <span aria-hidden="true">G</span>
      </h2>
      <nav class="content-links content-links--single" aria-label="Blog links">
        <a class="content-card" href="https://charlesshang.github.io/blogs/">
          <h3>Random Notes</h3>
          <p>機器學習、大型語言模型、擴散模型與表徵學習。</p>
          <p>技術筆記與論文深讀。</p>
        </a>
      </nav>
    </section>

    <section class="content-section" aria-labelledby="ai-literature-title">
      <h2 id="ai-literature-title">AI <span class="script-word">for</span> Literature</h2>
      <nav class="content-links" aria-label="AI for Literature links">
        <a class="content-card" href="https://charlesshang.github.io/guji/">
          <h3>古籍</h3>
          <p>詩經、唐詩、宋詞、易經、論語、老莊與古文名篇。</p>
          <p>原文、字音、白話與講評，逐章逐篇讀懂經典。</p>
        </a>
        <a class="content-card" href="https://charlesshang.github.io/sishi/index.html">
          <h3>四史</h3>
          <p>自黃帝以至晉初，凡三千年之興衰治亂，皆在四史之間</p>
          <p>史記，漢書，後漢書，三國志</p>
        </a>
      </nav>
    </section>

    <nav class="links" aria-label="personal links">
      <a href="https://github.com/charlesshang">GitHub</a>
      <a href="https://www.linkedin.com/in/charlesshang/?locale=en">LinkedIn</a>
      <a href="https://scholar.google.com/citations?user=HvTC0TIAAAAJ&amp;hl=en&amp;oi=ao">Google Scholar</a>
    </nav>
  </main>
</body>
</html>
